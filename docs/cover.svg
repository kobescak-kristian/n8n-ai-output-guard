<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="1600" height="1200" fill="url(#bg)"/>

  <text x="100" y="170" fill="#93c5fd" font-size="34" font-weight="600" letter-spacing="2">N8N  ·  CLAUDE  ·  SLACK</text>
  <text x="100" y="270" fill="#f8fafc" font-size="92" font-weight="700">AI Output Guard</text>
  <text x="100" y="345" fill="#cbd5e1" font-size="40">Broken AI answers never crash your workflow</text>
  <text x="100" y="397" fill="#cbd5e1" font-size="40">or reach your data unchecked.</text>

  <!-- flow -->
  <rect x="100" y="470" width="300" height="120" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <text x="250" y="522" fill="#f8fafc" font-size="34" font-weight="600" text-anchor="middle">Your AI step</text>
  <text x="250" y="562" fill="#94a3b8" font-size="26" text-anchor="middle">any model</text>
  <line x1="410" y1="530" x2="520" y2="530" stroke="#94a3b8" stroke-width="4" marker-end="url(#a)"/>
  <rect x="530" y="450" width="420" height="160" rx="18" fill="#1d4ed8" stroke="#60a5fa" stroke-width="3"/>
  <text x="740" y="515" fill="#ffffff" font-size="40" font-weight="700" text-anchor="middle">Guard</text>
  <text x="740" y="560" fill="#dbeafe" font-size="25" text-anchor="middle">schema check · 1 retry · fallback</text>
  <text x="740" y="593" fill="#dbeafe" font-size="25" text-anchor="middle">injection check · log · alerts</text>
  <line x1="960" y1="500" x2="1080" y2="480" stroke="#94a3b8" stroke-width="4" marker-end="url(#a)"/>
  <line x1="960" y1="560" x2="1080" y2="585" stroke="#94a3b8" stroke-width="4" marker-end="url(#a)"/>
  <rect x="1090" y="430" width="410" height="90" rx="14" fill="#064e3b" stroke="#34d399" stroke-width="3"/>
  <text x="1295" y="487" fill="#ecfdf5" font-size="32" font-weight="600" text-anchor="middle">checked data</text>
  <rect x="1090" y="545" width="410" height="90" rx="14" fill="#7c2d12" stroke="#fb923c" stroke-width="3"/>
  <text x="1295" y="602" fill="#fff7ed" font-size="32" font-weight="600" text-anchor="middle">person reviews in Slack</text>

  <!-- results -->
  <text x="100" y="745" fill="#93c5fd" font-size="30" font-weight="600">SAME 89 CLAIM CASES, BEFORE AND AFTER THE GUARD</text>
  <rect x="100" y="780" width="680" height="220" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="140" y="880" fill="#f87171" font-size="96" font-weight="700">26</text>
  <text x="290" y="870" fill="#94a3b8" font-size="64">→</text>
  <text x="380" y="880" fill="#34d399" font-size="96" font-weight="700">0</text>
  <text x="140" y="950" fill="#e2e8f0" font-size="36">workflow crashes</text>
  <rect x="820" y="780" width="680" height="220" rx="18" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <text x="860" y="880" fill="#f87171" font-size="96" font-weight="700">42</text>
  <text x="1010" y="870" fill="#94a3b8" font-size="64">→</text>
  <text x="1100" y="880" fill="#34d399" font-size="96" font-weight="700">0</text>
  <text x="860" y="950" fill="#e2e8f0" font-size="36">bad rows saved</text>

  <text x="100" y="1090" fill="#94a3b8" font-size="30">3 gated test runs · 231 cases, 66 written blind and sealed before testing</text>
</svg>
