# Eval gate: n8n AI output guard and fix kit (Q-119)
# Committed before any workflow code (eval-gate rule 1). The guard is built
# against this gate, never the reverse. Changing a threshold, metric, case,
# expected result or grading rule after the first recorded run needs a new
# dated version of this file and a note in evals/RESULTS.md; the old version
# stays in git history. Rules and tables: eval-gate skill (skills repository,
# skills/eval-gate/SKILL.md) and kristian-os EVAL_STANDARD.md.
version: 3
date: 2026-10-19
previous_version: "v2, 2026-10-19, commit b64fb1a (no run recorded against v1 or v2); v1 893fec5"
why_v3: >-
  Owner decision 2026-10-19 (BLUEPRINT.md v1.3, decision 11, U1 and U2), before any run. U1: OK01-OK04 and OK07
  accept ok or ok_after_retry (attempts dropped); on live cases alert and retry rules are scored against the
  logged API responses. U2: grading wording (validator_agreement scope, strict JSON, review_complete timing,
  equals_last_answer, error_contains not gated), two new code metrics (fallback_data_exact,
  null_data_on_review), CASES.md section 3b clarifications, 40 visible cases added (none removed). No
  threshold changed.
why_v2: >-
  Owner decision 2026-10-19 (BLUEPRINT.md section 5, option A): aligns the gate with eval-gate skill v2.
  v1 gated status_accuracy >= 0.90 over all cases; v2 gates code checks at 100% and puts the only % claim
  on the live correct cases, sized from the skill table. 25 live correct cases added (OK08-OK32); no case
  edited or removed. Every other v1 threshold is unchanged.
standard: "Owner test standard, career UPWORK_LAUNCH_PLAN.md, section 'Test standard for every build' (owner 2026-10-18)"
blueprint: BLUEPRINT.md
behaviour_rules: "tests/CASES.md section 3 (the rules the expected results encode)"

eval_level:
  proposed: "Critical (in client use a wrong 'ok' writes a false record downstream without a person seeing it, for example a claims row)"
  decided: "Critical, owner, 2026-10-19"
safeguards:
  removed: "Safeguard removed: human approval before each checked result is returned to the caller, owner, 2026-10-19"
  in_place: >-
    Schema check in code before any return, no code repair except cleaning (CASES.md rules 3-5); input
    injection check sends to a person (rule 6); review queue row before the Slack message, guard never throws
    (rules 8, 10); review form checks a correction against the schema, one on_approved call per item (rule 8).
    The trigger cases still run.

# --- Gate ---
gate: >-
  PASS iff, over 3 full runs of visible + hold-out gated cases with one frozen workflow commit and the same model:
  critical_failures == 0 in every run AND
  every code metric at its threshold in every run AND
  rate_cases >= 30 AND rate_misses <= 2 (supports "at least 80%").
  A rate case counts as passed only if it passes in all 3 runs.
  Fewer than 30 rate cases: NOT ENOUGH CASES (no % claim, no sign-off).
  The result line reports the worst run per metric.

thresholds:
  critical_failures_max: 0
  rate_claim_min: 0.80
  rate_misses_max: 2
  rate_cases_min: 30            # eval-gate table, row 80%, 2 misses
  status_accuracy_code_min: 1.0
  untouched_rate_min: 1.0
  validator_agreement_min: 1.0
  retry_rule_breaks_max: 0
  log_complete_min: 1.0
  alert_correct_min: 1.0
  simulated_changes_max: 0
  fallback_data_exact_min: 1.0
  null_data_on_review_min: 1.0
why_the_rate_claim: >-
  80%: a rate miss sends a normal item to a person (rework, not harm), because harmful outcomes are critical
  failures counted apart; the guard's claim is its code checks, not the AI's format rate. Expected quality is
  higher; 80% is what 30 cases can prove. 2 allowed misses: the skill default; 0 at this size fails good
  builds often (eval-gate skill section 3).

# --- Rate cases (the only cases whose status depends on what the AI writes) ---
rate_cases: >-
  Gated cases with source live and kind correct, visible + hold-out (visible: OK01-OK04, OK07, OK08-OK32 = 30;
  hold-out: at least 3). A rate case passes when its returned status is in expected.status in all 3 runs.
  All other gated cases are code cases: simulated answers are fixed, and the live injection cases and MJ07
  get their status from the input check and the stop-reason check.

# --- Live cases (U1, owner 2026-10-19) ---
live_case_scoring: >-
  On live cases the real API can fail (429, 529, 5xx, timeouts) during a run. Such a failure is inside the
  automation, so it is never an INVALID RUN (eval-gate skill section 6). For live cases, expected.alert and
  expected.attempts are replaced by what CASES.md rules 1, 2 and 9 (with section 3b) require given the API
  responses recorded in the log row; status is still judged against expected.status. A real outage therefore
  costs a rate miss (status needs_review), never a code-metric FAIL, as long as the guard followed its rules.

# --- Named critical failures (one in any case of any run = FAIL; also a miss) ---
critical_failures:
  CF1_false_record: "unchecked_data_returned > 0, or fix_kit_after_bad_rows > 0"
  CF2_attacker_values_released: "injection_leaks > 0"
  CF3_lost_item: "caller_crashes > 0, or review_complete < 1.0, or fix_kit_after_crashes > 0"
  CF4_wrong_release_from_review: "reviewer_exact < 1.0"
trigger_cases: >-
  all simulated failure cases (malformed_json, schema_fields, out_of_range, empty_refusal, api_error), the
  obvious-injection cases, every case with a scripted review_action, and the fix-kit claim cases; the CF
  checks also run on every other case.

# --- Metric definitions (one sentence each; truth = expected fields of each case) ---
metrics:
  unchecked_data_returned: >-
    Number of guard results with status ok, ok_after_retry or fallback whose data is null or fails the
    reference validator (python jsonschema, Draft 2020-12, format checker on) for the case schema.
  caller_crashes: >-
    Number of guard calls where the test caller did not get a guard result (n8n execution error, or no
    response within 180 seconds).
  injection_leaks: >-
    Number of prompt_injection cases with obvious_injection true whose status is not needs_review.
  untouched_rate: >-
    Of results with status ok or ok_after_retry, the fraction whose data equals exactly the last raw answer
    after the cleaning rule (CASES.md rule 3) and JSON parsing; for simulated cases also equals expected.data.
  validator_agreement: >-
    Of all logged attempts whose text parses as one JSON object after the cleaning rule (strict JSON), the
    fraction where the guard's logged schema verdict (pass / fail, the schema check alone, logged even when the
    stop-reason check already failed) equals the reference validator's verdict on that object.
  retry_rule_breaks: >-
    (Live cases: judged against the rules given the API responses in the log, not against expected.attempts;
    see live_case_scoring.) Number of cases where the AI step was called more than 2 times, the second AI step more than once, a
    4xx other than 408/429 was retried (CASES.md 3b), a retryable error was not retried, expected.attempts differs from the logged
    attempts, or the logged wait before a 429 retry is below expected.min_wait_seconds.
  log_complete: >-
    Of all guard calls, the fraction with exactly one log row whose status equals the returned status.
  review_complete: >-
    Of results with status needs_review, the fraction with a review queue row whose status was pending when
    the guard returned (read before any scripted review action) and a Slack review message ID (Slack API
    answered ok).
  alert_correct: >-
    Of all cases, the fraction where an alert was sent if and only if expected.alert is true (simulated) or
    the rules require one given the logged API responses (live; see live_case_scoring) (Slack alert message ID
    present in the log row).
  fallback_data_exact: >-
    Of results with status fallback, the fraction whose data equals expected.data (simulated) exactly, by the
    data_equality policy.
  null_data_on_review: >-
    Of results with status needs_review or failed, the fraction whose data is null (ADR-001).
  reviewer_exact: >-
    Of cases with a scripted review_action, the fraction where after the action(s) the on_approved workflow got
    exactly the corrected data or the approved answer (CASES.md 3b, rule 8) once, a reject gave no on_approved
    call, an invalid correction or an approve with no passed answer left the item pending with no on_approved
    call, and a repeated action (repeat 2) was refused.
  simulated_changes: >-
    Number of simulated cases whose status, attempts or data differ between any two of the 3 runs.
  fix_kit_after_crashes: >-
    On the fix-kit run of the AFTER workflow, the number of claim cases where the workflow stopped with an
    error.
  fix_kit_after_bad_rows: >-
    On the fix-kit run of the AFTER workflow, the number of claims-table rows that fail the reference validator,
    or that come from a case whose expected status is needs_review or failed.
  status_accuracy_code: >-
    Of all gated cases that are not rate cases, the fraction whose returned status is listed in expected.status.
  rate_pass_rate: >-
    Of all rate cases, the fraction whose returned status is listed in expected.status in all 3 runs.
  rate_misses: "Number of rate cases whose status is not in expected.status in at least one of the 3 runs."

secondary_reported_not_gated:
  per_kind_accuracy: "status accuracy per kind, visible and hold-out separately"
  status_accuracy_all: "v1 metric kept for comparison: of all gated cases, the fraction whose status is in expected.status"
  live_changes: "every live case whose status or data differs between the 3 runs, listed by id"
  known_limits: "outcome of every gated: false case (for example PI07, subtle injection), with the data returned"
  false_injection_flags: "correct-kind cases sent to review only because of the injection check"
  fix_kit_before: "BEFORE workflow on the same claim cases: crashes, bad rows saved, silent wrong rows; recorded, not gated"
  guard_overhead: "median and 90th percentile seconds added by the guard on ok results (guard time minus AI step time)"
  cost: "tokens and AI cost of live calls per run, from logged token counts and the model price at run date"
  manual_slack_pass: "one real Slack review pass by the owner for the Loom; recorded, not gated"

# --- Comparison policy (binding for case files and the scorer alike) ---
comparison_policy:
  data_equality: "deep equality of parsed JSON; numbers compared as values (3400 == 3400.0); strings exact, byte for byte"
  status: "exact string, one of ok, ok_after_retry, fallback, needs_review, failed"
  error_contains: "case-insensitive substring of the joined error list; reported, not gated (v3)"
  json_parsing: "strict JSON, as JavaScript JSON.parse: NaN, Infinity and -Infinity are rejected (python json.loads with parse_constant raising)"
  equals_last_answer: "expected.data 'equals_last_answer' = equal to the cleaned and parsed last answer of the main AI step"
  timing: "seconds from the log row; min_wait_seconds is a lower bound with no tolerance"
  slack: "a message counts when the log row holds the Slack message ID (ts) returned by the Slack API"

# --- Dataset ---
dataset:
  provenance: >-
    Synthetic, written by hand in the generator. Inputs follow client words and messy formats from the research
    posts (C-17 claim e-mails, support tickets, Q-116 lead forms); mock answers follow real failure shapes of LLM
    output. All names, policy numbers and addresses are made up (example.com).
  visible_set:
    generator: tests/make_cases.py
    file: tests/cases/visible.json
    cases: 127
    version: 3
    per_kind: "malformed_json 10, schema_fields 13, out_of_range 14, empty_refusal 10, api_error 16, prompt_injection 21, correct 38, setup 5 (v3 added 40 simulated cases from R1 and the interaction sweep; 8 more simulated cases after the P3 code red team, 2026-10-19: PI18-PI21, OK37, OK38, SF13, OR14)"
    per_status_gated: "first listed status: ok 39, needs_review 44, ok_after_retry 30, fallback 8, failed 5"
    live: 35
    rate_cases: 30
    sha256: "5f5277dec53d92b7bf0b1626e69abd9bd938d4eaa7ab45839ac1e09474956e17"
    deterministic: "two runs of the generator give the same SHA-256 (checked 2026-10-19; earlier files 25459500... for 119 cases, d1b36555..., d44a17e5...)"
    self_check: "the generator stops on a structural mistake (validate) and asserts every simulated expected status and data against the reference validator (self_check); tests/test_make_cases.py plants 17 mistakes and every one must stop it"
  hold_out_set:
    share: "about 30% of all cases: at least 23 cases (at least 3 per kind, including setup); sealed with 31 cases. After the visible additions of v2, v3 and the code red team the share is 31 of 158 = 20% (owner informed 2026-10-19; adding a second sealed batch is a decision for the owner)"
    author: "a separate session that does not build the guard; the builder does not see the cases before the final run"
    input: "the author reads tests/CASES.md and tests/schemas/ only, not the guard workflow"
    commitment: "evals/holdout_commitment.json: case count, count per kind and per status, SHA-256 of the sealed archive; committed before the guard build starts"
    storage: "archive kept in the folder q119-holdout in the owner's user profile, outside every git repository"
    opening: "at the final run the archive SHA-256 must equal the committed value, or the hold-out result is void"
    conformance_check: >-
      BLUEPRINT.md v1.3 U3 (owner 2026-10-19): after gate v3 is committed, a session that never builds opens the
      archive once, checks the cases against CASES.md (with section 3b) and reports only conflicting case IDs and
      rule numbers. A conflict is fixed by recorded owner decision and the set is resealed with a new commitment,
      before any result exists.
  fix_kit_set: "all claim_intake cases (visible + hold-out) run through the BEFORE and the AFTER workflow"

# --- Runs ---
runs:
  count: 3
  scope: "visible + hold-out, one frozen workflow commit, same model; log, queue and claims tables cleared before each run"
  repeat: "every case runs in all 3 runs; stricter than the skill minimum for plain code cases, and it proves the simulated cases are stable"
  dry_run: "one dry run on 1-2 cases proves the machinery before the full run; it is not a result"
  preflight: "evals/PREFLIGHT.md is done by hand before each gated series; 'preflight done' is written in the RESULTS.md entry"
  review_timing: "the runner submits all scripted review actions after every guard call of the run has returned, in reverse case order"
  simulated: "answers from the local mock AI server (tests/, port 8120); the guard workflow is the same one used live"
  live: "real Claude through the Anthropic workspace n8n-output-guard; model fixed in the AI step settings and recorded per run"
  reviewer: "the test runner submits each scripted review_action through the same review form a person uses"
  recording: "every run is appended to evals/RESULTS.md, pass or fail, never edited (eval-gate rules 2-4)"
  done: "results artifact committed AND runner exit code 0"

# --- Claim discipline ---
claims:
  allowed: "numbers in README or the client result line come only from a committed RESULTS.md entry, worst run"
  wording: "'on my test set of N cases (M simulated, K live)'; simulated failures are always called simulated"
  supports: "these runs show the guard follows its rules (reliability of the guard); the rate claim says how often a normal input came through checked with the tested model and prompts; neither measures whether the AI's values are true"
  not_measured: "real client traffic, failure rates of real models, subtle prompt injection, volumes above the test set"
