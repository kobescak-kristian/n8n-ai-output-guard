# Offline checks on Linux, macOS and Windows: the injection check and the
# AI-check verdict code (both run the guard's own JavaScript in Node), the
# test-set checks, and a rebuild of the visible test cases that must give the
# committed file byte for byte. No n8n, no network, no keys. The gated runs
# need n8n plus Anthropic and Slack accounts and are not run here.
# Actions are pinned to full commit SHAs (the tag in the comment). Node.js is
# the version preinstalled on each runner.
name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the test-case checker's one dependency
        run: python -m pip install jsonschema==4.26.0
      - name: Injection check
        run: python tests/test_injection.py
      - name: AI-check verdict code
        run: python tests/test_inj_verdict.py
      - name: Test-set checks stop on planted mistakes
        run: python tests/test_make_cases.py
      - name: Rebuild the visible test cases
        run: python tests/make_cases.py
      - name: The rebuilt file must equal the committed one
        run: git diff --exit-code -- tests/cases/visible.json
